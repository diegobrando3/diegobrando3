name: Generate Live GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Stats SVG
        run: |
          python3 -c '
          import urllib.request
          import json

          url = "https://api.github.com/users/diegobrando3"
          req = urllib.request.Request(url, headers={"User-Agent": "GitHub-Action"})
          
          try:
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
                  repos = data.get("public_repos", 0)
                  followers = data.get("followers", 0)
          except Exception:
              repos, followers = 0, 0

          svg = f"""<svg width="450" height="160" viewBox="0 0 450 160" xmlns="http://www.w3.org/2000/svg">
            <style>
              .bg {{ fill: #0d1117; rx: 12px; }}
              .title {{ fill: #58a6ff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-weight: bold; font-size: 15px; }}
              .text {{ fill: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; }}
              .accent {{ fill: #3fb950; font-weight: bold; }}
            </style>
            <rect width="450" height="160" class="bg" stroke="#30363d" stroke-width="1"/>
            <text x="30" y="35" class="title">📊 Enes\x27s GitHub Stats</text>
            <text x="30" y="75" class="text">📁 Public Repositories: <tspan class="accent">{repos}</tspan></text>
            <text x="30" y="110" class="text">👥 Followers: <tspan class="accent">{followers}</tspan></text>
          </svg>"""

          with open("stats.svg", "w", encoding="utf-8") as f:
              f.write(svg)
          '

      - name: Commit and push stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          git commit -m "chore: update stats svg" || exit 0
          git push
