name: Update GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *' # Her gün gece yarısı otomatik çalışır
  workflow_dispatch: # İstersen GitHub panelinden tek tıkla manuel tetikleyebilirsin

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Botun repona dosya kaydedebilmesi için yetki verir
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Stats SVG
        run: |
          curl -s "https://github-readme-stats.vercel.app/api?username=diegobrando3&show_icons=true&theme=dark&hide_border=true" > stats.svg
          curl -s "https://github-readme-stats.vercel.app/api/top-langs/?username=diegobrando3&layout=compact&theme=dark&hide_border=true" > top-langs.svg

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg top-langs.svg
          git commit -m "chore: update generated stats svgs" || exit 0
          git push
